name: Publish LidMate v1.0.3

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.0.3.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "2c220d2fdbcf2a4def60d0ef276801c4bfca421c7123b11ba0774091e6d69d9d  downloads/LidMate-macOS-arm64.dmg" | sha256sum -c -
          gh release create v1.0.3 downloads/LidMate-macOS-arm64.dmg \
            --target "$GITHUB_SHA" \
            --title "LidMate v1.0.3" \
            --notes "修复显示模式解析导致镜像切换无响应，并在显示器跟随进程意外退出后自动重启。适用于 Apple Silicon、macOS 13+。安装包采用临时签名，未经过 Apple 公证。"
